name: sync-media-to-r2
# Keeps the R2 bucket in step with public/Vista/media whenever tiles change on kijb-v2.
# media/ stays in git (the VPS/Docker flow on main needs it); Cloudflare Pages strips it
# at build time (build command: rm -rf public/Vista/media) and serves it from R2 instead.
on:
  push:
    branches:
      - kijb-v2
    paths:
      - 'public/Vista/media/**'
      - 'scripts/upload-media-to-r2.sh'
      - '.github/workflows/sync-media-to-r2.yml'
  workflow_dispatch:

concurrency:
  group: sync-media-to-r2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install rclone
        run: sudo apt-get update -y && sudo apt-get install -y rclone
      - name: Upload media to R2 (copy only, never deletes)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: ./scripts/upload-media-to-r2.sh
